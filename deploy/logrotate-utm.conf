# logrotate for the campaign log written by deploy/nginx.conf.
#
# Install to /etc/logrotate.d/postuptothe-utm (root-owned, 0644 — logrotate skips a
# config that is group- or world-writable):
#   sudo cp deploy/logrotate-utm.conf /etc/logrotate.d/postuptothe-utm
#   sudo chmod 0644 /etc/logrotate.d/postuptothe-utm
#   sudo logrotate -d /etc/logrotate.d/postuptothe-utm   # dry run, prints what it would do
#
# Why this file exists at all: the stock /etc/logrotate.d/nginx globs
# /var/log/nginx/*.log and keeps 14 rotations, so a launch week's campaign data would
# age out a fortnight after the launch — and it cannot be collected again afterwards.
# The campaign log is named .tsv precisely so it sits outside that glob (logrotate
# errors on a log claimed by two configs) and this file can give it its own retention.
#
# postuptothe.access.log is NOT listed here on purpose: it matches *.log, so the stock
# nginx config already rotates it. Adding it here is the duplicate-entry error above.

/var/log/nginx/postuptothe.utm.tsv {
    weekly
    rotate 104
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        # The stock nginx config does this for the logs in its own glob. This one is
        # not in that glob, so it needs its own signal: without a USR1 nginx keeps
        # writing to the renamed inode and the fresh file stays empty forever.
        if [ -f /run/nginx.pid ]; then kill -USR1 "$(cat /run/nginx.pid)"; fi
    endscript
}
