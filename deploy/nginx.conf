# nginx site config for the portfolio + rebound demo backend.
# Install to /etc/nginx/sites-available/postuptothe and symlink into sites-enabled.
# Then run certbot (see DEPLOY.md) to add TLS.

server {
    listen 80;
    listen [::]:80;
    server_name postuptothe.net www.postuptothe.net;

    root /var/www/site;
    index index.html;

    # Static portfolio
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Rebound prediction API -> gunicorn on localhost.
    # /api/rebound/predict  ->  http://127.0.0.1:8000/predict
    location /api/rebound/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache static assets (images, css, js) for a week — these get new filenames
    # when they change, so a long cache is safe.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ...but the data/manifest JSON is updated in place by the content scripts and
    # can change often, so it must revalidate instead of being cached for a week.
    # (A regex location takes priority over the /assets/ prefix above.) nginx serves
    # Last-Modified/ETag for static files, so an unchanged file still 304s cheaply.
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}

# After running certbot --nginx, it rewrites the above to listen on 443 with the
# Let's Encrypt cert and adds an HTTP->HTTPS redirect automatically.
