# nginx site config for the portfolio + rebound demo backend.
# Install to /etc/nginx/sites-available/postuptothe and symlink into sites-enabled.
# Then run certbot (see DEPLOY.md) to add TLS.
#
# Campaign tracking lives here rather than in a third-party analytics script: UTM
# parameters are just query string, and nginx already sees every one of them. See
# "Campaign tracking" in DEPLOY.md, and `scripts/utm.py report` for reading the result.


# ---------------------------------------------------------------- campaign tracking
# `sites-enabled/*` is included inside `http`, so these three http-context directives
# belong at the top of this file rather than inside the server block below.

# One tab-separated line per tagged landing. Deliberately NOT `combined`: this file is
# read by a script and, more to the point, it carries no $remote_addr. rebound-app's
# telemetry.py keeps prediction rows free of anything identifying a visitor; a campaign
# log that quietly reintroduced an IP per line would undo that for the same traffic.
# escape=default renders a literal tab inside a value as \x09, so splitting on tab is safe.
log_format utm escape=default
    '$time_iso8601\t$status\t$request_uri\t'
    '$arg_utm_source\t$arg_utm_medium\t$arg_utm_campaign\t'
    '$http_referer\t$http_user_agent';

# Only requests that actually carry a utm_source reach the campaign log. Without this
# every asset request would land in it and the file would just be a second access log.
map $arg_utm_source $tagged {
    default 1;
    ""      0;
}

# Shareable short links: /go/<slug> 302s to the real page with its parameters attached,
# so what gets pasted into a post is short and what gets logged is unambiguous. Add a
# campaign by adding a line here — the redirect hop itself carries no utm_source, so it
# is not logged; the landing request the browser follows it with is.
#
# `return` uses this value verbatim as the Location header (unlike `rewrite`, it does not
# append the original query string), so the parameters below are exactly what arrives.
map $uri $shortlink {
    default "";

    /go/li-rebound  "/blog/posts/building-the-rebound-predictor.html?utm_source=linkedin&utm_medium=social&utm_campaign=rebound-launch";
    /go/tw-rebound  "/blog/posts/building-the-rebound-predictor.html?utm_source=twitter&utm_medium=social&utm_campaign=rebound-launch";
}


server {
    listen 80;
    listen [::]:80;
    server_name postuptothe.net www.postuptothe.net;

    root /var/www/site;
    index index.html;

    # Two logs on purpose. The normal one is `combined` and rotates on the stock
    # /etc/logrotate.d/nginx schedule; the campaign one is tab-separated, holds only
    # tagged landings, and is named .tsv so it falls OUTSIDE that file's /var/log/nginx/*.log
    # glob -- logrotate refuses a log claimed by two configs, and this one wants a much
    # longer retention than 14 days (deploy/logrotate-utm.conf).
    access_log /var/log/nginx/postuptothe.access.log combined;
    access_log /var/log/nginx/postuptothe.utm.tsv   utm if=$tagged;

    # Short campaign links -> the real page with its UTM parameters (see the $shortlink
    # map above). `return` is one of the two directives that are safe inside `if`.
    location /go/ {
        if ($shortlink = "") { return 404; }
        return 302 $shortlink;
    }

    # Static portfolio
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Rebound prediction API -> gunicorn on localhost.
    # /api/rebound/predict  ->  http://127.0.0.1:8000/predict
    location /api/rebound/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache static assets (images, css, js) for a week — these get new filenames
    # when they change, so a long cache is safe.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ...but the data/manifest JSON is updated in place by the content scripts and
    # can change often, so it must revalidate instead of being cached for a week.
    # (A regex location takes priority over the /assets/ prefix above.) nginx serves
    # Last-Modified/ETag for static files, so an unchanged file still 304s cheaply.
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}

# After running certbot --nginx, it rewrites the above to listen on 443 with the
# Let's Encrypt cert and adds an HTTP->HTTPS redirect automatically.
